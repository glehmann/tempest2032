[package]
name = "tempest2032"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
lyon_tessellation = "1"
svgtypes = "0.16"
xmrs = { version = "0.15", default-features = false, features = ["std", "import_mod"] }
xmrsplayer = { version = "0.15", default-features = false, features = ["std"] }
bevy = { version = "0.18", default-features = false, features = [
    "std", "async_executor", "bevy_asset", "bevy_log",
    "bevy_winit", "bevy_pbr", "bevy_post_process", "bevy_ui_render",
    "default_font", "bevy_sprite_render", "bevy_audio", "bevy_gilrs", "png",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crc32fast = "1"
dirs = "6"
keyvalues-parser = "0.2"
steamlocate = "2.1"
sysinfo = "0.37"
tempfile = "3"
bevy = { version = "0.18", default-features = false, features = ["multi_threaded", "x11", "wayland", "sysinfo_plugin"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.18", default-features = false, features = ["web", "webgl2"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "UrlSearchParams"] }

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.web-release]
inherits = "release"
opt-level = 2
strip = "none"
