[package]
name = "t2k"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
dirs = "6"
keyvalues-parser = "0.2"
steamlocate = "2.1"
sysinfo = "0.37"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
lyon_tessellation = "1"
svgtypes = "0.16"
xmrs = { version = "0.15", default-features = false, features = ["std", "import_mod"] }
xmrsplayer = { version = "0.15", default-features = false, features = ["std"] }
bevy = { version = "0.18", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
    "bevy_winit", "bevy_pbr", "bevy_post_process", "bevy_ui_render",
    "default_font", "bevy_sprite_render", "bevy_audio", "bevy_gilrs", "x11", "wayland", "png", "sysinfo_plugin",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
