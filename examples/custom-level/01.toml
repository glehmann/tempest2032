# An eight-lane practice web. All other levels use their embedded definitions.
number = 1
enemy_count = 12
# Optional: put your own file beside this TOML, or change the path.
# Missing or undecodable files fall back to this level's original music.
soundtrack = "soundtrack.ogg"

[web]
closed = true
start_lane = 0
depth = 180
vertices = [[5, 2], [11, 2], [14, 5], [14, 11], [11, 14], [5, 14], [2, 11], [2, 5]]
orientations = [0, -32, -64, -96, -128, -160, -192, -224]

[flippers]
enabled = true
first_spawn_ticks = 120
spawn_interval_ticks = 180
climb_speed = 0.5
flip_speed = 4
pause_ticks = 8
max_active = 6

[tankers]
first_spawn_ticks = 360
spawn_interval_ticks = 600
climb_speed = 0.4

[appearance]
surface = [0.1, 0.05, 0.5]
lines = [0.1, 0.8, 1.0]
flipper = [255, 80, 20]

[powerups]
kill_interval = 3
