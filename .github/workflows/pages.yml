name: Browser deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: browser-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish browser game
    if: github.repository == 'tempest2032/tempest2032' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust with the WASM target
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Cache Rust dependencies and bindings tool
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: pages-wasm32-unknown-unknown
          cache-bin: true
      - name: Install matching WASM bindings tool
        run: |
          version=$(python3 -c 'import tomllib; lock = tomllib.load(open("Cargo.lock", "rb")); print(next(p["version"] for p in lock["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build browser game
        run: python3 tools/web.py build
      - name: Publish to website repository
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: tempest2032/tempest2032.github.io
          publish_branch: gh-pages
          publish_dir: target/web
          enable_jekyll: false
